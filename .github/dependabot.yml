# GitHub Actions only. The Python tree here is resolved by uv, pinned in uv.lock, and reached
# through cross-repo path dependencies Dependabot cannot see — a per-package PR against this repo
# would be contradicted by mu-core's lockfile the moment it landed. Python updates are done with
# `uv lock --upgrade` and reviewed as one change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 3
