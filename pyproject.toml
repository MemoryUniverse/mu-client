# mu-client — the on-device LOCAL client (daemon-app-skeleton-spec.md; PACKAGING-v2 §1.2, §1.3).
# Depends on mu-core ONLY (mu-contracts + mu-engine + mu-local). NEVER mu-server
# (import-linter "client-has-no-server" below + the grep backstop in
# tests/unit/test_import_boundaries.py — PACKAGING-v2 §5.3).
#
# This STAGE (foundation + daemonless): ClientSettings, the LocalMemoryHost lifecycle wrapper
# around mu-local's LocalMemory, and the daemonless `mu add|recall|search` CLI. The daemon
# (IpcServer/CaptureService/SqliteOutbox/WorkerPool) is a LATER stage (daemon-app-skeleton-spec.md).
[project]
name = "mu-client"
version = "0.1.0"
description = "Memory Universe — mu-client: on-device LOCAL client (LocalMemory host + daemonless CLI; daemon is a later stage)."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
readme = "README.md"
# No "License ::" trove classifier on purpose: PEP 639 replaced it with the `license` expression
# above, and declaring both is the deprecated form.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    # mu-core distributions ONLY (never mu-server). BOUNDED ranges, not bare names (OSS-GATE-0828
    # §"unbounded internal pins"): the wheel this repo builds carries `Requires-Dist: mu-contracts`
    # verbatim, and `[tool.uv.sources]` below is a DEV-ONLY override that never reaches wheel
    # metadata — so a bare name told any future registry installer "any mu-contracts ever
    # published will do", including a 0.9 that no longer speaks this wire vocabulary. The four
    # mu-core distributions version in lockstep with this one, so the range is the 0.1.x line.
    "mu-contracts>=0.1.0,<0.2.0",
    "mu-engine>=0.1.0,<0.2.0",
    "mu-local>=0.1.0,<0.2.0",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # Local-plane MCP server surface (AGENT-INTEGRATION-AUDIT-AND-PLAN.md §4 Phase 1): the official
    # Model Context Protocol Python SDK (FastMCP stdio host + client). Local plane ONLY — never
    # mu-server (import-linter "client-has-no-server").
    "mcp>=1.12,<2",
    # Round-trip TOML editing for `mu install codex` (AGENT-INTEGRATION-AUDIT-AND-PLAN.md §4 Phase
    # 4): codex config is TOML, and preserving the owner's existing comments/formatting on a
    # backup-first, never-clobber merge needs a writer — stdlib `tomllib` is read-only.
    "tomlkit>=0.13,<1",
    # Decision D4's client-side agent-share consent surface (mu_client/consent/) speaks two REST
    # routes on mu-server: GET /v1/rooms/{id}/agent-share/{agent} and POST .../agent-share/revoke.
    # httpx, NOT `mu-sdk`: mu-sdk is a FOURTH sibling repo (not a mu-core package, despite the root
    # CLAUDE.md's repo table) and wraps zero room/consent/trust surface, so it cannot speak these
    # routes at all. This keeps import-linter's `client-has-no-server` contract trivially clean.
    # The dependency question is REPORTED as an architecture delta for an owner ruling.
    "httpx>=0.27,<1",
]

# Open-source metadata (OSS-GATE-0828): without these a published page carries no link back to
# the source, the tracker, or the license text — and `mu-client` is one of the four Apache-2.0
# repos the Open-Source Gate is about.
[project.urls]
Homepage = "https://github.com/MemoryUniverse"
Repository = "https://github.com/MemoryUniverse/mu-client"
Issues = "https://github.com/MemoryUniverse/mu-client/issues"

[project.scripts]
# The daemonless one-shot muscle-memory binary (daemon-app-skeleton-spec.md §2, §6):
# `mu add|recall|search` construct the host, do the op, tear down — NO daemon required.
# `mu daemon run` is the resident daemon. `mu install|uninstall claude-code` (Phase 0,
# AGENT-INTEGRATION-AUDIT-AND-PLAN.md §4) write/remove the managed hook block. `verify|status`
# remain a LATER stage.
mu = "mu_client.cli:main"
# The local-plane MCP server (stdio). A Claude Code / Codex / generic MCP client spawns this via
# `.mcp.json` and speaks JSON-RPC over stdio (AGENT-INTEGRATION-AUDIT-AND-PLAN.md §4 Phase 1).
mu-mcp = "mu_client.mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "mypy>=1.13,<2",
    "ruff>=0.8,<0.9",
    "import-linter>=2.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mu_client"]

[tool.uv.sources]
# DEV-ONLY override. Directory dependencies onto the sibling mu-core repo's packages (PACKAGING-v2
# §5.5: "day one" pin is pending an actual registry push; mu-client and mu-core are sibling repos
# under mu_project/, not one uv workspace — see mu-sdk-python/pyproject.toml for the identical
# pattern). `editable = true` keeps a monorepo checkout resolving against the mu-core WORKING TREE
# (AD-90), which is the whole point.
#
# TWO CONSEQUENCES A STRANGER HITS, both verified 2026-08-28 and both documented in README.md:
#  1. These paths are relative to THIS file, so `git clone mu-client && uv sync` on its own fails
#     with "Distribution not found at: .../mu-core/packages/mu-contracts". mu-core must be cloned
#     as a SIBLING directory first. The README Quickstart now says so.
#  2. uv honours this table even when mu-client is consumed as a git URL, and rewrites the paths
#     against the git remote — `uv pip install "mu-client @ git+https://.../mu-client"` fails with
#     `has no subdirectory ../mu-core/packages/mu-contracts`. The registry-free install route is
#     therefore `uv pip install --no-sources` with explicit git URLs (README).
# Neither is a lockfile bug and neither is fixable from this table while dev must bind the working
# tree; both disappear the day the four mu-core distributions are on a registry and this whole
# table is deleted.
mu-contracts = { path = "../mu-core/packages/mu-contracts", editable = true }
mu-engine = { path = "../mu-core/packages/mu-engine", editable = true }
mu-local = { path = "../mu-core/packages/mu-local", editable = true }

# ------------------------------------------------------------------------------------------------
# mypy — strict, CI gate (DEV-STANDARDS "strict static typing").
# ------------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# Third-party libs without shipped stubs, reached transitively through mu-core (mirrors
# mu-core/pyproject.toml's override list — same boundary, same reviewer eye).
module = [
    "qdrant_client.*",
    "falkordb.*",
    "litellm.*",
    "sentence_transformers.*",
    "redis.*",
]
ignore_missing_imports = true

# ------------------------------------------------------------------------------------------------
# pytest — asyncio auto mode + the two required markers (DEV-STANDARDS testing).
# ------------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "unit: isolated logic; mocks permitted (DEV-STANDARDS: mocks ONLY in pure unit tests).",
    "integration: real running mu-dev-* containers, ZERO mocks (DEV-STANDARDS: non-negotiable).",
]
